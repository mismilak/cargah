{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}زنجیره{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url("{% static 'vendor/fonts/Vazirmatn-Regular.woff2' %}") format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Vazirmatn';
            src: url("{% static 'vendor/fonts/Vazirmatn-Medium.woff2' %}") format('woff2');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Vazirmatn';
            src: url("{% static 'vendor/fonts/Vazirmatn-SemiBold.woff2' %}") format('woff2');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Vazirmatn';
            src: url("{% static 'vendor/fonts/Vazirmatn-Bold.woff2' %}") format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Vazirmatn';
            src: url("{% static 'vendor/fonts/Vazirmatn-ExtraBold.woff2' %}") format('woff2');
            font-weight: 800;
            font-style: normal;
            font-display: swap;
        }

        html, body, input, button, textarea, select, a, p, h1, h2, h3, h4, h5, h6, span, div, label {
            font-family: 'Vazirmatn', sans-serif !important;
        }
    </style>

    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-950 text-white">
{% block content %}{% endblock %}
<script src="{% static 'js/jquery.min.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
